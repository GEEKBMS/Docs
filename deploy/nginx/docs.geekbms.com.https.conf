# HTTPS site for docs.geekbms.com.
# Installed after /etc/letsencrypt/live/docs.geekbms.com/ exists.
# The publish script issues that certificate once (certbot --webroot) when it
# is missing, then copies this file to /etc/nginx/conf.d/docs.geekbms.com.conf.
# It does not edit any other nginx site. Port 80 stays open for ACME renewal,
# then redirects. Web root is /var/www/geekbms-docs, separate from /var/www/geekbms.

server {
    listen 80;
    server_name docs.geekbms.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/geekbms-docs/current;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://docs.geekbms.com$request_uri;
    }
}

server {
    # `http2` on the listen line works on nginx 1.9.5+ (a warning on 1.25.1+).
    listen 443 ssl http2;
    server_name docs.geekbms.com;

    ssl_certificate     /etc/letsencrypt/live/docs.geekbms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.geekbms.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GeekbmsDocsSSL:10m;

    root /var/www/geekbms-docs/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
