# HTTP bootstrap for docs.geekbms.com.
# The publish script installs this only when
# /etc/letsencrypt/live/docs.geekbms.com/{fullchain,privkey}.pem
# are not both present. It serves the site and ACME http-01 challenges.
# Web root is /var/www/geekbms-docs, separate from /var/www/geekbms.

server {
    listen 80;
    server_name docs.geekbms.com;

    root /var/www/geekbms-docs/current;
    index index.html;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
